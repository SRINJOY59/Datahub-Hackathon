name: Backend CD (Deploy Sentinel API to Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "api/**"
      - "pipeline/**"
      - "ml/**"
      - "memory/**"
      - "governance/**"
      - "scenarios/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile.api"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPO: ${{ vars.GAR_REPOSITORY || 'sentinel-docker-repo' }}
  SERVICE_NAME: sentinel-api

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}"
          docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" -f Dockerfile.api .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: |
            --port=8090
            --allow-unauthenticated
            --memory=2Gi
            --cpu=2
            --min-instances=1
            --max-instances=10
            --set-env-vars=OPENROUTER_MODEL=${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }},GITHUB_REPO=${{ github.repository }},DATAHUB_GMS_URL=${{ vars.DATAHUB_GMS_URL || 'http://localhost:8080' }}
            --set-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,SLACK_BOT_TOKEN=SLACK_BOT_TOKEN:latest,SLACK_APP_TOKEN=SLACK_APP_TOKEN:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET:latest,WEBHOOK_SECRET_GENERIC=WEBHOOK_SECRET_GENERIC:latest,PAGERDUTY_ROUTING_KEY=PAGERDUTY_ROUTING_KEY:latest

      - name: Output Service URL
        run: |
          echo "================================================="
          echo "Sentinel API Deployed Successfully!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "GraphQL: ${{ steps.deploy.outputs.url }}/graphql"
          echo "Health: ${{ steps.deploy.outputs.url }}/health"
          echo "================================================="
