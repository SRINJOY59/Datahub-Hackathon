name: Backend CI (Test & Lint)

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "api/**"
      - "pipeline/**"
      - "ml/**"
      - "memory/**"
      - "governance/**"
      - "scenarios/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile.api"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest & Offline Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Dockerfile Build Dry-Run
        run: |
          docker build -t sentinel-api:ci-test -f Dockerfile.api .
