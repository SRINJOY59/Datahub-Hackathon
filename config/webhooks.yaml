# Webhook triggers — event-driven agent runs.
#
# Each source can map external identifiers (job names, DAG IDs) to DataHub
# asset URNs. The server verifies HMAC-SHA256 signatures using per-source
# secrets from .env (WEBHOOK_SECRET_DBT, WEBHOOK_SECRET_GITHUB, etc.).

enabled: true

server:
  host: "0.0.0.0"
  port: 8090
  workers: 2    # max concurrent agent runs

sources:
  dbt:
    enabled: true
    # dbt Cloud webhook → DataHub asset mapping.
    # Key: dbt job name. Value: DataHub asset URN.
    job_to_asset:
      "daily_feature_pipeline": "urn:li:dataset:(urn:li:dataPlatform:snowflake,prod.features.user_signals,PROD)"

  airflow:
    enabled: true
    # Airflow task failure callback → DataHub asset mapping.
    dag_to_asset:
      "train_churn_model": "urn:li:mlModel:(urn:li:dataPlatform:mlflow,churn_model_v2,PROD)"

  github:
    enabled: true
    # No explicit mapping — uses GitCommitDetector to find affected assets.

  generic:
    enabled: true
    # Caller provides asset_urn directly in the POST body.

schedule:
  # Periodic full sweep — catches problems no webhook fires for (e.g. a job
  # that silently stops running). Set to 0 to disable.
  sweep_interval_minutes: 30
