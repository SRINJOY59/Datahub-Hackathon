# Sentinel Webhook & Registry Monitor Configuration
# ==============================================================================
#
# 1. PUSH WEBHOOKS (Event-Driven / 0s Latency)
#    External systems (GitHub, Airflow, dbt Cloud, Stripe) push HTTP POST events.
#
# 2. PULL REGISTRY SWEEP (Scheduled / APScheduler)
#    Monitors upstream package registries (PyPI, npm) for breaking updates (Dependabot pattern).
# ==============================================================================

enabled: true

server:
  host: "0.0.0.0"
  port: 8090
  workers: 2

# --- 1. Push Webhook Event Sources ---
sources:
  github:
    enabled: true
    # GitHub push events & release.published webhooks.

  airflow:
    enabled: true
    # Airflow DAG/task failure callbacks.
    dag_to_asset:
      "train_churn_model": "urn:li:mlModel:(urn:li:dataPlatform:mlflow,churn_model_v2,PROD)"

  dbt:
    enabled: true
    # dbt Cloud assertion failure webhooks.
    job_to_asset:
      "daily_feature_pipeline": "urn:li:dataset:(urn:li:dataPlatform:snowflake,prod.features.user_signals,PROD)"

  advisory:
    enabled: true
    # Vendor SaaS API breaking-change webhooks (e.g. Stripe, Twilio, OpenAI).

  generic:
    enabled: true
    # Direct incident push.

# --- 2. Upstream Registry Sweep Schedule (PyPI / npm) ---
schedule:
  # Interval in minutes for APScheduler to scan PyPI for breaking updates across codebase dependencies.
  sweep_interval_minutes: 60
  auto_remediate: true
